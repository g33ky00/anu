name: CI Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Ecosystem
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.detect.outputs.has_go }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_php: ${{ steps.detect.outputs.has_php }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_powershell: ${{ steps.detect.outputs.has_powershell }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_java: ${{ steps.detect.outputs.has_java }}
      has_ruby: ${{ steps.detect.outputs.has_ruby }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          [ -f go.mod ] && echo "has_go=true" >> $GITHUB_OUTPUT || echo "has_go=false" >> $GITHUB_OUTPUT
          [ -f package.json ] && echo "has_node=true" >> $GITHUB_OUTPUT || echo "has_node=false" >> $GITHUB_OUTPUT
          ([ -f requirements.txt ] || [ -f pyproject.toml ]) && echo "has_python=true" >> $GITHUB_OUTPUT || echo "has_python=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "*.php" -not -path "./.git/*" -not -path "./vendor/*" -not -path "./node_modules/*" 2>/dev/null | head -1 | grep -q . && echo "has_php=true" >> $GITHUB_OUTPUT || echo "has_php=false" >> $GITHUB_OUTPUT
          [ -f Cargo.toml ] && echo "has_rust=true" >> $GITHUB_OUTPUT || echo "has_rust=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "*.ps1" -o -name "*.psm1" -o -name "*.psd1" 2>/dev/null | head -1 | grep -q . && echo "has_powershell=true" >> $GITHUB_OUTPUT || echo "has_powershell=false" >> $GITHUB_OUTPUT
          [ -f tsconfig.json ] && echo "has_typescript=true" >> $GITHUB_OUTPUT || echo "has_typescript=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "pom.xml" -o -name "build.gradle" -o -name "*.java" 2>/dev/null | head -1 | grep -q . && echo "has_java=true" >> $GITHUB_OUTPUT || echo "has_java=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "Gemfile" -o -name "*.rb" 2>/dev/null | head -1 | grep -q . && echo "has_ruby=true" >> $GITHUB_OUTPUT || echo "has_ruby=false" >> $GITHUB_OUTPUT

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme-check:
    name: README Compliance
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.summary.outputs.readme_result }}
    steps:
      - uses: actions/checkout@v4

      - name: README exists
        run: |
          [ -f README.md ] && echo "✅ README.md exists" || (echo "❌ README.md missing" && exit 1)

      - name: Required sections (charte)
        run: |
          MISSING=0
          check() {
            for p in "$@"; do
              grep -qiE "$p" README.md && echo "✅ $p" && return 0
            done
            return 1
          }
          check "## À propos" "## About" "## 📖 À propos" "## 🎖 À propos" "## 📋 À propos" || { echo "❌ Section 'À propos' manquante"; MISSING=$((MISSING+1)); }
          check "## Structure" "## 📁 Structure" "## 🗂 Structure" "## Project Structure" "## Arborescence" || { echo "❌ Section 'Structure' manquante"; MISSING=$((MISSING+1)); }
          check "## Stack" "## 🛠 Stack" "## ⚙ Stack" "## Tech Stack" "## Built With" "## 📚 Stack" || { echo "❌ Section 'Stack' manquante"; MISSING=$((MISSING+1)); }
          check "## Contribution" "## 🤝 Contribution" "## Contributing" "## Contribuer" "## 👥 Contribution" || { echo "❌ Section 'Contribution' manquante"; MISSING=$((MISSING+1)); }
          check "## Licence" "## 📄 Licence" "## License" "## 📜 Licence" "## ⚖ Licence" || { echo "❌ Section 'Licence/License' manquante"; MISSING=$((MISSING+1)); }
          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "❌ $MISSING section(s) obligatoire(s) manquante(s)"
            exit 1
          fi

      - name: Badges mandatory
        run: |
          BADGES=$(grep -cE 'https://img\.shields\.io/badge|https://badge\.fury\.io|https://codecov\.io|https://github\.com/.*/actions/workflows' README.md)
          if [ "$BADGES" -ge 1 ]; then
            echo "✅ $BADGES badge(s) détecté(s)"
          else
            echo "❌ Aucun badge trouvé (obligatoire)"
            echo "   → Ajouter des badges shields.io (license, stack, CI status)"
            exit 1
          fi

      - name: Not an operations runbook
        run: |
          ISSUES=0
          if grep -vE 'https?://|github\.com|shields\.io|badge|codecov' README.md | grep -qE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "⚠️ Adresse IP détectée → déplacer vers DEPLOYMENT.md"
            ISSUES=$((ISSUES + 1))
          fi
          if grep -qE '(/etc/|/var/www/|/home/|/opt/|/usr/local/|/srv/)[^ ]+' README.md; then
            echo "⚠️ Chemin serveur détecté → déplacer vers DEPLOYMENT.md"
            ISSUES=$((ISSUES + 1))
          fi
          if [ $ISSUES -gt 0 ]; then
            echo ""
            echo "❌ $ISSUES indicateur(s) de runbook dans README"
            exit 1
          fi
          echo "✅ Pas de contenu d'exploitation détecté"

      - name: Structure matches reality
        run: |
          MISSING=0
          FILES=$(grep -oE '`[^`]+`|\[.*\]\(([^)]+)\)' README.md | grep -oE '[^`()]+\.(php|js|css|json|md|sh|py|go|txt|html|vue|ts|rb|rs|toml|yml|yaml|env\.example)' | grep -vE '^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\b' | sort -u)
          for f in $FILES; do
            echo "$f" | grep -qE '^https?://|^/|^\.' && continue
            if [ ! -e "$f" ]; then
              echo "⚠️ Mentionné mais absent : $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "❌ $MISSING fichier(s) mentionné(s) mais absent(s)"
            exit 1
          fi
          echo "✅ Fichiers mentionnés cohérents"

      - name: Stack versions match code
        run: |
          ISSUES=0
          if [ -f package.json ]; then
            CODE_VER=$(grep -oE '"version"\s*:\s*"[^"]+"' package.json | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            DOC_VER=$(grep -oE '[Vv]ersion[^0-9]*[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ -n "$CODE_VER" ] && [ -n "$DOC_VER" ] && [ "$CODE_VER" != "$DOC_VER" ]; then
              echo "⚠️ Version: README=$DOC_VER ≠ package.json=$CODE_VER"
              ISSUES=$((ISSUES + 1))
            elif [ -n "$CODE_VER" ]; then
              echo "✅ Version package.json cohérente ($CODE_VER)"
            fi
          fi
          if [ -f go.mod ]; then
            CODE_GO=$(head -3 go.mod | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
            DOC_GO=$(grep -oiE '[Gg]o[^0-9]*[0-9]+\.[0-9]+(\.[0-9]+)?' README.md | head -1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
            if [ -n "$CODE_GO" ] && [ -n "$DOC_GO" ] && [ "$CODE_GO" != "$DOC_GO" ]; then
              echo "⚠️ Go: README=$DOC_GO ≠ go.mod=$CODE_GO"
              ISSUES=$((ISSUES + 1))
            elif [ -n "$CODE_GO" ]; then
              echo "✅ Version Go cohérente ($CODE_GO)"
            fi
          fi
          if [ $ISSUES -gt 0 ]; then
            echo ""
            echo "❌ $ISSUES incohérence(s) de version"
            exit 1
          fi
          echo "✅ Versions stack cohérentes"

      - name: License file exists
        run: |
          if grep -qiE '## Licence|## License' README.md; then
            LIC=$(grep -oE '\[.*LICENSE.*\]\(([^)]+)\)' README.md | grep -oE '\(([^)]+)\)' | tr -d '()' | head -1)
            [ -z "$LIC" ] && LIC="LICENSE"
            if [ -f "$LIC" ]; then
              echo "✅ Fichier licence : $LIC"
            else
              echo "❌ Licence référencée mais fichier absent : $LIC"
              exit 1
            fi
          else
            echo "⏭️ Pas de section licence"
          fi

      - name: Links validity (warning)
        run: |
          BROKEN=0
          for url in $(grep -oE 'https?://[^ )\]]+' README.md | sort -u | grep -vE 'github\.com/.*/(issues|pull|actions)' | head -10); do
            if curl -sf --max-time 5 "$url" > /dev/null 2>&1; then
              echo "✅ $url"
            else
              echo "⚠️ Lien potentiellement mort : $url"
              BROKEN=$((BROKEN + 1))
            fi
          done
          [ $BROKEN -gt 0 ] && echo "⚠️ $BROKEN lien(s) à vérifier" || echo "✅ Liens OK"

      - id: summary
        if: always()
        run: |
          RESULT="${{ job.status }}"
          echo "readme_result=$RESULT" >> $GITHUB_OUTPUT
          echo "readme_status=$RESULT" >> $GITHUB_STEP_SUMMARY

  go-checks:
    name: Go
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Vuln Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
      - name: Security
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec ./...
      - name: Tests
        run: go test -v ./...
      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  node-checks:
    name: Node.js
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: NPM Audit
        run: npm audit --audit-level=high 2>&1 || true
      - name: ESLint
        run: |
          npm install -g eslint 2>/dev/null || true
          npx eslint . --max-warnings=0 --ignore-pattern 'node_modules/' --ignore-pattern 'dist/' --ignore-pattern 'build/' 2>&1 || true
      - name: Tests
        run: |
          [ -f package.json ] && npm test 2>&1 || echo "No tests configured"

  typescript-checks:
    name: TypeScript
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Type Check
        run: |
          npm install -g typescript 2>/dev/null || true
          npx tsc --noEmit 2>&1 || true

  python-checks:
    name: Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Pip Audit
        run: |
          pip install pip-audit 2>/dev/null || true
          pip-audit --strict 2>&1 || true
      - name: Bandit
        run: |
          pip install bandit 2>/dev/null || true
          bandit -r . -ll -x ./tests,./test,./venv,.venv 2>&1 || true
      - name: Tests
        run: |
          pip install pytest 2>/dev/null || true
          python -m pytest 2>&1 || echo "No tests configured"

  php-checks:
    name: PHP
    needs: detect
    if: needs.detect.outputs.has_php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./wp-admin/*" -not -path "./wp-includes/*" -not -path "./wp-content/*" -exec php -l {} \; 2>&1 || true
      - name: Hardcoded Secrets
        run: |
          grep -rnE "(password|secret|api_key|token).*[\"'][A-Za-z0-9+/=]{20,}[\"']" \
            --include="*.php" --include="*.js" --include="*.json" \
            . 2>/dev/null | grep -v node_modules | grep -v ".git" || echo "No hardcoded secrets detected"

  rust-checks:
    name: Rust
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit
        run: |
          cargo install cargo-audit 2>/dev/null || true
          cargo audit 2>&1 || true
      - name: Clippy
        run: cargo clippy -- -D warnings 2>&1 || true
      - name: Tests
        run: cargo test 2>&1 || true

  powershell-checks:
    name: PowerShell
    needs: detect
    if: needs.detect.outputs.has_powershell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser 2>/dev/null || true
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning 2>&1 || true
        shell: pwsh

  java-checks:
    name: Java
    needs: detect
    if: needs.detect.outputs.has_java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: lts
      - name: Tests (Maven)
        run: |
          [ -f pom.xml ] && mvn test -B 2>&1 || echo "No Maven project"
      - name: Tests (Gradle)
        run: |
          [ -f build.gradle ] && ./gradlew test 2>&1 || echo "No Gradle project"

  ruby-checks:
    name: Ruby
    needs: detect
    if: needs.detect.outputs.has_ruby == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Audit
        run: |
          gem install bundler-audit 2>/dev/null || true
          bundle audit 2>&1 || true
      - name: Brakeman
        run: |
          gem install brakeman 2>/dev/null || true
          brakeman -q -w2 2>&1 || true

  ci-summary:
    name: CI Summary
    if: always()
    needs: [detect, secrets-scan, readme-check, go-checks, node-checks, typescript-checks, python-checks, php-checks, rust-checks, powershell-checks, java-checks, ruby-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              UCQCS — RAPPORT DE VALIDATION                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Dépôt : ${{ github.repository }}"
          echo "Commit : ${{ github.sha }}"
          echo "Branche : ${{ github.ref_name }}"
          echo "Déclencheur : ${{ github.event_name }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          check() {
            local name="$1"
            local status="$2"
            local detail="$3"
            case "$status" in
              success)  echo "  ✅ $name : PASS" ;;
              failure)  echo "  ❌ $name : FAIL — $detail" ;;
              skipped)  echo "  ⏭️  $name : SKIP (non applicable)" ;;
              cancelled) echo "  🚫 $name : CANCELLED" ;;
              *)        echo "  ⚠️  $name : $status" ;;
            esac
          }
          
          # Verdicts
          RS="${{ needs.secrets-scan.result }}"
          RC="${{ needs.readme-check.result }}"
          GC="${{ needs.go-checks.result }}"
          NC="${{ needs.node-checks.result }}"
          TC="${{ needs.typescript-checks.result }}"
          PC="${{ needs.python-checks.result }}"
          PH="${{ needs.php-checks.result }}"
          RU="${{ needs.rust-checks.result }}"
          PS="${{ needs.powershell-checks.result }}"
          JC="${{ needs.java-checks.result }}"
          RB="${{ needs.ruby-checks.result }}"
          
          FAILED=0
          
          check "Secrets Scan" "$RS" "gitleaks a détecté un secret en clair"
          [ "$RS" = "failure" ] && FAILED=$((FAILED+1))
          
          check "README Compliance" "$RC" "README non conforme à la charte (sections manquantes, badges absents, ou contenu runbook)"
          [ "$RC" = "failure" ] && FAILED=$((FAILED+1))
          
          check "Go Checks" "$GC" "govulncheck/gosec/test non conforme"
          [ "$GC" = "failure" ] && FAILED=$((FAILED+1))
          
          check "Node.js Checks" "$NC" "npm audit/eslint/test non conforme"
          [ "$NC" = "failure" ] && FAILED=$((FAILED+1))
          
          check "TypeScript Checks" "$TC" "tsc --noEmit a détecté des erreurs"
          [ "$TC" = "failure" ] && FAILED=$((FAILED+1))
          
          check "Python Checks" "$PC" "pip-audit/bandit/pytest non conforme"
          [ "$PC" = "failure" ] && FAILED=$((FAILED+1))
          
          check "PHP Checks" "$PH" "php -l a détecté une erreur de syntaxe"
          [ "$PH" = "failure" ] && FAILED=$((FAILED+1))
          
          check "Rust Checks" "$RU" "cargo audit/clippy/test non conforme"
          [ "$RU" = "failure" ] && FAILED=$((FAILED+1))
          
          check "PowerShell Checks" "$PS" "PSScriptAnalyzer a détecté des erreurs"
          [ "$PS" = "failure" ] && FAILED=$((FAILED+1))
          
          check "Java Checks" "$JC" "mvn/gradle test non conforme"
          [ "$JC" = "failure" ] && FAILED=$((FAILED+1))
          
          check "Ruby Checks" "$RB" "bundler-audit/brakeman non conforme"
          [ "$RB" = "failure" ] && FAILED=$((FAILED+1))
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          if [ $FAILED -eq 0 ]; then
            echo "🎉 RÉSULTAT : TOUTES LES VÉRIFICATIONS ONT RÉUSSI"
            echo ""
            echo "Aucun problème détecté. Le code est conforme aux standards UCQCS."
          else
            echo "🚨 RÉSULTAT : $FAILED VÉRIFICATION(S) EN ÉCHEC"
            echo ""
            echo "Les contrôles ci-dessus ont échoué. Consultez les logs détaillés"
            echo "de chaque job pour identifier les actions correctives nécessaires."
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Stack détecté :"
          echo "  Go:          ${{ needs.detect.outputs.has_go }}"
          echo "  Node.js:     ${{ needs.detect.outputs.has_node }}"
          echo "  Python:      ${{ needs.detect.outputs.has_python }}"
          echo "  PHP:         ${{ needs.detect.outputs.has_php }}"
          echo "  Rust:        ${{ needs.detect.outputs.has_rust }}"
          echo "  PowerShell:  ${{ needs.detect.outputs.has_powershell }}"
          echo "  TypeScript:   ${{ needs.detect.outputs.has_typescript }}"
          echo "  Java:        ${{ needs.detect.outputs.has_java }}"
          echo "  Ruby:        ${{ needs.detect.outputs.has_ruby }}"
          
          echo ""
          echo "Généré le : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "UCQCS v4.3 — Unified Code Quality Control System"
          
          # Write to GitHub Step Summary
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          ## 📊 UCQCS — Rapport de Validation
          
          EOF
          
          echo "| Job | Statut | Détail |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          summary_row() {
            local name="$1"
            local status="$2"
            local detail="$3"
            case "$status" in
              success)  echo "| $name | ✅ PASS | — |" >> $GITHUB_STEP_SUMMARY ;;
              failure)  echo "| $name | ❌ FAIL | $detail |" >> $GITHUB_STEP_SUMMARY ;;
              skipped)  echo "| $name | ⏭️ SKIP | Non applicable |" >> $GITHUB_STEP_SUMMARY ;;
              *)        echo "| $name | ⚠️ $status | — |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          }
          
          summary_row "Secrets Scan" "$RS" "Secret en clair"
          summary_row "README Compliance" "$RC" "Non conforme charte"
          summary_row "Go Checks" "$GC" "Échec tests/vuln"
          summary_row "Node.js Checks" "$NC" "Échec audit/lint"
          summary_row "TypeScript Checks" "$TC" "Échec type check"
          summary_row "Python Checks" "$PC" "Échec audit/tests"
          summary_row "PHP Checks" "$PH" "Échec syntaxe"
          summary_row "Rust Checks" "$RU" "Échec audit/clippy"
          summary_row "PowerShell Checks" "$PS" "Échec analyze"
          summary_row "Java Checks" "$JC" "Échec tests"
          summary_row "Ruby Checks" "$RB" "Échec audit"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ $FAILED -eq 0 ]; then
            echo "**RÉSULTAT : ✅ TOUTES LES VÉRIFICATIONS ONT RÉUSSI**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**RÉSULTAT : ❌ $FAILED VÉRIFICATION(S) EN ÉCHEC**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Consultez les logs détaillés pour identifier les actions correctives." >> $GITHUB_STEP_SUMMARY
          fi
