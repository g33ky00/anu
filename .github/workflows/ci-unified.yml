name: CI Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Ecosystem
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.detect.outputs.has_go }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_php: ${{ steps.detect.outputs.has_php }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_powershell: ${{ steps.detect.outputs.has_powershell }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_java: ${{ steps.detect.outputs.has_java }}
      has_ruby: ${{ steps.detect.outputs.has_ruby }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          [ -f go.mod ] && echo "has_go=true" >> $GITHUB_OUTPUT || echo "has_go=false" >> $GITHUB_OUTPUT
          [ -f package.json ] && echo "has_node=true" >> $GITHUB_OUTPUT || echo "has_node=false" >> $GITHUB_OUTPUT
          ([ -f requirements.txt ] || [ -f pyproject.toml ]) && echo "has_python=true" >> $GITHUB_OUTPUT || echo "has_python=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "*.php" -not -path "./.git/*" -not -path "./vendor/*" -not -path "./node_modules/*" 2>/dev/null | head -1 | grep -q . && echo "has_php=true" >> $GITHUB_OUTPUT || echo "has_php=false" >> $GITHUB_OUTPUT
          [ -f Cargo.toml ] && echo "has_rust=true" >> $GITHUB_OUTPUT || echo "has_rust=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "*.ps1" -o -name "*.psm1" -o -name "*.psd1" 2>/dev/null | head -1 | grep -q . && echo "has_powershell=true" >> $GITHUB_OUTPUT || echo "has_powershell=false" >> $GITHUB_OUTPUT
          [ -f tsconfig.json ] && echo "has_typescript=true" >> $GITHUB_OUTPUT || echo "has_typescript=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "pom.xml" -o -name "build.gradle" -o -name "*.java" 2>/dev/null | head -1 | grep -q . && echo "has_java=true" >> $GITHUB_OUTPUT || echo "has_java=false" >> $GITHUB_OUTPUT
          find . -maxdepth 3 -name "Gemfile" -o -name "*.rb" 2>/dev/null | head -1 | grep -q . && echo "has_ruby=true" >> $GITHUB_OUTPUT || echo "has_ruby=false" >> $GITHUB_OUTPUT

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-checks:
    name: Go
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Vuln Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
      - name: Security
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec ./...
      - name: Tests
        run: go test -v ./...
      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  node-checks:
    name: Node.js
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: NPM Audit
        run: npm audit --audit-level=high 2>&1 || true
      - name: ESLint
        run: |
          npm install -g eslint 2>/dev/null || true
          npx eslint . --max-warnings=0 --ignore-pattern 'node_modules/' --ignore-pattern 'dist/' --ignore-pattern 'build/' 2>&1 || true
      - name: Tests
        run: |
          [ -f package.json ] && npm test 2>&1 || echo "No tests configured"

  typescript-checks:
    name: TypeScript
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Type Check
        run: |
          npm install -g typescript 2>/dev/null || true
          npx tsc --noEmit 2>&1 || true

  python-checks:
    name: Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Pip Audit
        run: |
          pip install pip-audit 2>/dev/null || true
          pip-audit --strict 2>&1 || true
      - name: Bandit
        run: |
          pip install bandit 2>/dev/null || true
          bandit -r . -ll -x ./tests,./test,./venv,.venv 2>&1 || true
      - name: Tests
        run: |
          pip install pytest 2>/dev/null || true
          python -m pytest 2>&1 || echo "No tests configured"

  php-checks:
    name: PHP
    needs: detect
    if: needs.detect.outputs.has_php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./wp-admin/*" -not -path "./wp-includes/*" -not -path "./wp-content/*" -exec php -l {} \; 2>&1 || true
      - name: Hardcoded Secrets
        run: |
          grep -rnE "(password|secret|api_key|token).*[\"'][A-Za-z0-9+/=]{20,}[\"']" \
            --include="*.php" --include="*.js" --include="*.json" \
            . 2>/dev/null | grep -v node_modules | grep -v ".git" || echo "No hardcoded secrets detected"

  rust-checks:
    name: Rust
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit
        run: |
          cargo install cargo-audit 2>/dev/null || true
          cargo audit 2>&1 || true
      - name: Clippy
        run: cargo clippy -- -D warnings 2>&1 || true
      - name: Tests
        run: cargo test 2>&1 || true

  powershell-checks:
    name: PowerShell
    needs: detect
    if: needs.detect.outputs.has_powershell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser 2>/dev/null || true
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning 2>&1 || true
        shell: pwsh

  java-checks:
    name: Java
    needs: detect
    if: needs.detect.outputs.has_java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: lts
      - name: Tests (Maven)
        run: |
          [ -f pom.xml ] && mvn test -B 2>&1 || echo "No Maven project"
      - name: Tests (Gradle)
        run: |
          [ -f build.gradle ] && ./gradlew test 2>&1 || echo "No Gradle project"

  ruby-checks:
    name: Ruby
    needs: detect
    if: needs.detect.outputs.has_ruby == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Audit
        run: |
          gem install bundler-audit 2>/dev/null || true
          bundle audit 2>&1 || true
      - name: Brakeman
        run: |
          gem install brakeman 2>/dev/null || true
          brakeman -q -w2 2>&1 || true
